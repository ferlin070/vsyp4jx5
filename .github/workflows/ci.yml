name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
        # verify gates: assert-app, typecheck, test, a11y, a11y-scan, build, size, git-status
      - run: npm run audit -- --fail
        # self-score gate: every category >= 60 and under the 64KB template cap